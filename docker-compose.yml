services:
  blue:
    build: .
    expose:
      - "8083"
    environment:
      - APP_COLOR= BLUE

  green:
    build: .
    expose:
      - "8083"
    environment:
      - APP_COLOR=GREEN  
  nginx:
    image: nginx:latest
    ports:
      - "8081:80"
    volumes:
      - "./nginx.conf:/etc/nginx/nginx.conf:ro"
    depends_on:
      - blue
      - green

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml:ro"
    depends_on:
      - blue
      - green

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
